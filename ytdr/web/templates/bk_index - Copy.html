{% extends "base.html" %}

{% block content %}

<div class="card shadow">

    <div class="card-body">

        <h2>

            Professional YouTube Downloader

        </h2>

        <hr>

        <form>

            <label class="form-label">

                Video URL

            </label>

            <input
                type="text"
                class="form-control"
                placeholder="https://youtube.com/watch?v=..."
            >

            <button
                class="btn btn-primary mt-3"
                type="submit">

                Analyze

            </button>

        </form>

    </div>

</div>

{% endblock %}
