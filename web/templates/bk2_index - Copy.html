{% extends "base.html" %}

{% block content %}

<div class="main-card card">

<div class="card-body p-5">

<h2 class="fw-bold">

<i class="bi bi-youtube text-danger"></i>

Download YouTube Videos

</h2>

<p class="text-muted">

Analyze videos, choose codecs, and download the best quality.

</p>

<hr>

<form>

<div class="mb-3">

<label class="form-label">

Single Video URL

</label>

<input
class="form-control form-control-lg"
placeholder="https://youtube.com/watch?v=...">

</div>

<button class="btn btn-danger">

<i class="bi bi-search"></i>

Analyze Video

</button>

</form>

<hr class="my-5">

<h4>

Batch Download

</h4>

<textarea
class="form-control"
rows="6"
placeholder="Paste multiple URLs here..."></textarea>

<div class="mt-3">

<input
class="form-control"
type="file">

</div>

<button
class="btn btn-primary mt-3">

Analyze Batch

</button>

</div>

</div>

{% endblock %}
